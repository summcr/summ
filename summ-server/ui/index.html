<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>summ</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <div class="shell topbar-inner">
    <a class="brand" href="/">
      <!--
        An inline copy of `logo.svg`, so the tile can take its colour from the
        palette and follow the theme - an <img> could not. It must stay in step
        with `logo.svg`, and so must the terminal banner's pixel copy in
        `src/splash.rs`.
      -->
      <svg class="brand-mark" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
        <rect class="tile" width="32" height="32" rx="7"/>
        <path class="glyph" d="M22 8H10l6 8-6 8h12" fill="none" stroke-width="4" stroke-linecap="square"/>
      </svg>
      <span class="brand-name">summ</span>
    </a>
    <span class="host" id="host"></span>
    <nav class="topbar-nav">
      <a href="/">Repositories</a>
    </nav>
  </div>
</header>

<main id="main" class="shell" aria-live="polite">
  <div class="loading">Loading…</div>
</main>

<footer class="shell foot">
  <span id="footer-version">summ</span>
  <span class="dot">·</span>
  <a href="/v2/">Registry API</a>
  <span class="dot">·</span>
  <a href="/api/v1/repositories">Discovery API</a>
</footer>

<script src="/app.js"></script>
</body>
</html>
