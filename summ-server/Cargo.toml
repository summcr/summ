[package]
name = "summ-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "summ"
path = "src/main.rs"

# The HTTP layer still talks to storage only through the `seam::Registry` trait
# defined here; `backend` is the one module that names the crates below, and
# `memory` remains a complete second implementation of the same trait. Nothing
# under `handlers/` may import any of these three directly.
[dependencies]
summ-core.workspace = true
summ-meta.workspace = true
summ-storage.workspace = true
summ-registry.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes.workspace = true
sha2.workspace = true
async-trait = "0.1"
# `StreamExt::next` over an axum body, to write an upload through frame by
# frame instead of buffering a layer to append it.
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true
# The wiring suite runs the whole binary on the second engine, which needs this
# crate's own `redb` feature on for the test build and off everywhere else.
summ-server = { path = ".", features = ["redb"] }

[features]
# Not a default: see summ-meta's manifest. Enabling it adds `Engine::Redb`,
# which only a test can name now that `--engine` is gone.
redb = ["summ-meta/redb"]
