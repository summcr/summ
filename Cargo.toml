[workspace]
members = [
    "summ-core",
    "summ-meta",
    "summ-storage",
    "summ-registry",
    "summ-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
summ-core = { path = "summ-core" }
summ-meta = { path = "summ-meta" }
summ-storage = { path = "summ-storage" }
summ-registry = { path = "summ-registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
postcard = { version = "1", features = ["alloc"] }
redb = "2"
rocksdb = "0.25"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
bytes = "1"
tempfile = "3"
